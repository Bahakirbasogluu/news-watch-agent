[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "newswatch"
version = "0.1.0"
description = "A news-watch agent: scans the press for a watch-list of companies and sends one deduplicated digest."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Baha Kırbaşoğlu" }]
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
bridge = ["mcp>=2.0"]
azure = ["openai>=1.40"]
dev = ["pytest>=8", "anyio>=4", "ruff>=0.5", "mcp>=2.0"]

[project.scripts]
newswatch = "newswatch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/newswatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
